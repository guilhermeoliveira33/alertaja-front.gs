<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertaJá - Ocorrências</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-ocorrencias">
    <header>
        <h1>AlertaJá</h1>
        <p>Monitoramento e prevenção de enchentes e deslizamentos</p>
        <button type="button" id="btn-menu" aria-expanded="false">Menu</button>
    </header>

    <nav>
        <a href="../index.html">Início</a>
        <a href="mapa.html">Mapa</a>
        <a href="ocorrencias.html">Ocorrências</a>
        <a href="sobre.html">Sobre</a>
        <a href="faq.html">FAQ</a>
        <a href="contato.html">Contato</a>
        <a href="integrantes.html">Integrantes</a>
    </nav>

    <main>
        <article>
            <h2>Registrar ocorrência</h2>
            <form id="form-ocorrencia">
                <label for="tipo">Tipo de ocorrência</label>
                <input type="text" id="tipo" name="tipo" placeholder="Ex.: Alagamento ou deslizamento" required>

                <label for="bairro">Bairro ou região</label>
                <input type="text" id="bairro" name="bairro" placeholder="Ex.: Vila Prudente" required>

                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" placeholder="Informe o que está acontecendo no local" required></textarea>

                <p class="centro">
                    <button type="submit" class="botao">Registrar</button>
                </p>
            </form>
        </article>

        <aside>
            <h3>Ocorrências registradas</h3>
            <div id="lista-ocorrencias">
                <p id="sem-ocorrencias">Nenhuma ocorrência registrada ainda.</p>
            </div>
        </aside>
    </main>

    <footer>
        <p>AlertaJá — Monitoramento Urbano e Prevenção de Riscos</p>
    </footer>

    <script src="../js/menu.js"></script>
</body>
</html>
